<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>小黑盒视频解析</title>
    <link rel="icon" href="https://www.xiaoheihe.cn/favicon.ico" />
    <script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="container">
      <header class="header">
        <h1>
          <img
            src="https://www.xiaoheihe.cn/favicon.ico"
            alt=""
            width="28"
            height="28"
            class="logo-img"
          />小黑盒视频解析
        </h1>
        <p class="intro">粘贴小黑盒分享链接，获取视频直链</p>
      </header>

      <div class="glass-card" id="inputCard">
        <div class="url-field">
          <input
            id="urlInput"
            type="text"
            placeholder="https://api.xiaoheihe.cn/v3/bbs/..."
            autocomplete="off"
            autocorrect="off"
            spellcheck="false"
          />
          <button id="parseBtn">
            <span class="spinner" id="spinner"></span>
            <span id="btnLabel">解析</span>
          </button>
        </div>
        <p class="hint">粘贴 api.xiaoheihe.cn 网址的帖子分享链接即可解析</p>
        <div class="error-msg" id="errorMsg"></div>
      </div>

      <div class="glass-card" id="resultCard" style="display: none">
        <div class="video-meta" id="videoMeta" style="display: none">
          <h2 class="video-title" id="videoTitle"></h2>
          <p class="video-desc" id="videoDesc"></p>
        </div>
        <div class="player-wrap">
          <video id="player" controls playsinline></video>
        </div>
        <div class="result-actions">
          <a
            id="downloadBtn"
            class="btn-primary"
            target="_blank"
            rel="noopener"
          >
            <i class="ph ph-download-simple"></i> 下载视频
          </a>
          <button id="copyBtn" class="btn-secondary">
            <i class="ph ph-copy"></i> 复制直链
          </button>
        </div>
      </div>

      <footer class="footer">
        视频来自
        <a href="https://xiaoheihe.cn" target="_blank" rel="noopener">小黑盒</a>
        · 仅供学习使用
      </footer>
    </main>

    <script src="script.js"></script>
  </body>
</html>
