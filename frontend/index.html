<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小黑盒视频解析</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 主题切换 -->
<button class="theme-toggle" id="themeToggle" aria-label="切换明暗主题">
  <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
  <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
</button>

<!-- 背景光斑 -->
<div class="bg-orb orb-1"></div>
<div class="bg-orb orb-2"></div>
<div class="bg-orb orb-3"></div>

<main class="container">
  <header class="header">
    <h1>小黑盒视频解析</h1>
    <p class="intro">粘贴小黑盒分享链接，获取视频直链</p>
  </header>

  <div class="glass-card" id="inputCard">
    <div class="url-field">
      <input
        id="urlInput"
        type="text"
        placeholder="https://api.xiaoheihe.cn/v3/bbs/..."
        autocomplete="off"
        autocorrect="off"
        spellcheck="false"
      >
      <button id="parseBtn">
        <span class="spinner" id="spinner"></span>
        <span id="btnLabel">解析</span>
      </button>
    </div>
    <p class="hint">粘贴 api.xiaoheihe.cn 域名的帖子分享链接即可解析</p>
    <div class="error-msg" id="errorMsg"></div>
  </div>

  <div class="glass-card" id="resultCard" style="display:none">
    <div class="player-wrap">
      <video id="player" controls playsinline></video>
    </div>
    <div class="result-actions">
      <a id="downloadBtn" class="btn-primary" target="_blank" rel="noopener">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        下载视频
      </a>
      <button id="copyBtn" class="btn-secondary">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        复制直链
      </button>
    </div>
  </div>

  <footer class="footer">
    视频来自 <a href="https://xiaoheihe.cn" target="_blank" rel="noopener">小黑盒</a> · 仅供学习使用
  </footer>
</main>

<div class="toast" id="toast"></div>

<script src="script.js"></script>
</body>
</html>
